<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Henry Ho — Cybersecurity &amp; Engineering Portfolio</title>
  <meta name="description" content="High-school student working toward cybersecurity and engineering — projects, skills, CTF write-ups and certifications.">
  <meta name="author" content="Henry Ho">
  <meta name="theme-color" content="#080b10">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232ee6c5' d='M12 2l8 3.5V11c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">

  <!-- social sharing (edit the URL/title/description) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Henry Ho — Cybersecurity &amp; Engineering Portfolio">
  <meta property="og:description" content="Projects, skills, CTF write-ups and certifications.">
  <meta property="og:image" content="https://user.uploads.dev/file/178d711185230793cdbf1397c47fa8ed.jpg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="site-head" id="siteHead">
  <div class="wrap nav">
    <a class="brand" href="#top">
      <span class="mark" id="brandMark">HH</span>
      <span id="brandName">Henry Ho<small id="brandRole">Cybersecurity &amp; Engineering</small></span>
    </a>
    <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
    <div class="nav-tools">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle colour theme"></button>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false"></button>
    </div>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile sections"></nav>

<section class="hero" id="top">
  <div class="hero-bg"><canvas id="netCanvas" aria-hidden="true"></canvas></div>
  <div class="wrap">
    <div class="hero-grid">
      <div>
        <span class="eyebrow" id="heroKicker">Portfolio</span>
        <h1 id="heroTitle"></h1>
        <div class="roles" id="heroRoles"></div>
        <p class="lead" id="heroLead"></p>
        <div class="hero-actions" id="heroActions"></div>
        <div class="status-pill"><span class="dot"></span><span id="heroStatus"></span></div>
      </div>
      <div class="term" id="term" aria-hidden="true">
        <div class="term-bar"><i class="d1"></i><i class="d2"></i><i class="d3"></i><span id="termTitle">bash — portfolio</span></div>
        <div class="term-body" id="termBody"></div>
      </div>
    </div>
  </div>
</section>

<div class="ticker" aria-hidden="true"><div class="track" id="tickerTrack"></div></div>

<div class="stats"><div class="wrap"><div class="stats-row" id="statsRow"></div></div></div>

<section class="sec" id="about">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow" id="aboutKicker">About</span>
      <h2 id="aboutHeading"></h2>
    </div>
    <div class="about-grid">
      <div class="about-copy rv" id="aboutCopy"></div>
      <div class="rv">
        <div class="facts" id="aboutFacts"></div>
        <div class="chips" id="aboutChips"></div>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="skills">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow" id="skillsKicker">Toolkit</span>
      <h2 id="skillsHeading"></h2>
      <p id="skillsIntro"></p>
    </div>
    <div class="skill-grid" id="skillGrid"></div>
  </div>
</section>

<section class="sec" id="projects">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow" id="projKicker">Work</span>
      <h2 id="projHeading"></h2>
      <p id="projIntro"></p>
    </div>
    <div class="proj-tools rv" id="projFilters"></div>
    <div class="proj-grid" id="projGrid"></div>
  </div>
</section>

<section class="sec" id="experience">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow" id="expKicker">Path</span>
      <h2 id="expHeading"></h2>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<section class="sec" id="achievements">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow" id="achKicker">Proof</span>
      <h2 id="achHeading"></h2>
    </div>
    <div class="ach-grid">
      <div class="ach-col rv">
        <h3>Certifications &amp; courses</h3>
        <div id="certList"></div>
      </div>
      <div class="ach-col rv">
        <h3>CTFs &amp; competitions</h3>
        <div id="ctfList"></div>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="contact">
  <div class="wrap">
    <div class="contact-grid">
      <div class="contact-copy rv">
        <span class="eyebrow" id="contactKicker">Contact</span>
        <h2 id="contactHeading"></h2>
        <p id="contactBlurb"></p>
        <div class="mail-box">
          <span class="addr" id="mailAddr"></span>
          <button class="btn btn-sm" id="copyMail" type="button">Copy</button>
        </div>
        <div class="socials" id="socialList"></div>
      </div>
      <form class="msg rv" id="msgForm" novalidate>
        <div class="field"><label for="fromName">Your Name</label><input id="fromName" name="name" type="text" autocomplete="name" placeholder="Your Name"></div>
        <div class="field"><label for="fromEmail">you@example.com</label><input id="fromEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="fromMsg">Message</label><textarea id="fromMsg" name="message" placeholder="Say hi, or send a project, internship or CTF invitation..."></textarea></div>
        <button class="btn btn-primary" type="submit" id="sendBtn">Send message</button>
        <p class="form-note">Opens your mail app with the message pre-filled — no data leaves your browser.</p>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot">
    <div class="m"><b id="footName">Henry Ho</b><span id="footYear"></span> . . . last updated September 2026</div>
    <div class="foot-links" id="footLinks"></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head">
    <div><h3 id="modalTitle"></h3><div class="yr" id="modalMeta"></div></div>
    <button class="icon-btn" id="modalClose" type="button" aria-label="Close"></button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="src/config.js"></script>
<script src="src/main.js"></script>
</body>
</html>
